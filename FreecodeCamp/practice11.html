<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Survey Form</title>
</head>
<body>
  <h1 id="title">Survey Form</h1>
  <p id="description">Thank you for taking the time to help us improve the platform</p>

  <form id="survey-form">
    <!-- Name Field -->
    <label id="name-label" for="name">Name:</label>
    <input 
      type="text" 
      id="name" 
      placeholder="Enter your name" 
      required 
    />
    <br /><br />

    <!-- Email Field -->
    <label id="email-label" for="email">Email:</label>
    <input 
      type="email" 
      id="email" 
      placeholder="Enter your email" 
      required 
    />
    <br /><br />

    <!-- Number Field -->
    <label id="number-label" for="number">Age (optional):</label>
    <input 
      type="number" 
      id="number" 
      min="10" 
      max="99" 
      placeholder="Age" 
    />
    <br /><br />

    <!-- Dropdown -->
    <label for="dropdown">Which option best describes your current role?</label>
    <select id="dropdown">
      <option value="student">Student</option>
      <option value="job">Full Time Job</option>
      <option value="other">Other</option>
    </select>
    <br /><br />

    <!-- Radio Buttons -->
    <p>Would you recommend freeCodeCamp to a friend?</p>
    <label>
      <input type="radio" name="recommend" value="definitely" /> Definitely
    </label>
    <label>
      <input type="radio" name="recommend" value="maybe" /> Maybe
    </label>
    <br /><br />

    <!-- Checkboxes -->
    <p>What would you like to see improved? (Check all that apply)</p>
    <label>
      <input type="checkbox" value="frontend" /> Front-end Projects
    </label>
    <label>
      <input type="checkbox" value="backend" /> Back-end Projects
    </label>
    <br /><br />

    <!-- Textarea -->
    <label for="comments">Any comments or suggestions?</label><br />
    <textarea id="comments" placeholder="Enter your comment here..."></textarea>
    <br /><br />

    <!-- Submit Button -->
    <button id="submit" type="submit">Submit</button>
  </form>
</body>
</html>
